<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>李强 - 个人简历</title>
    <style>
        /* 全局放大 25% */
        html { font-size: 20px; }

        /* 引入方正粗黑宋简体 */
        @font-face {
            font-family: '方正粗黑宋简体';
            src: url('fonts/方正粗黑宋简体.ttf') format('truetype'),
                 url('fonts/方正粗黑宋简体.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            /* 科技灰黑主题变量 */
            --bg-color: #0a0a0c;
            --surface-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #f9f3c4;
            --primary-light: rgba(249, 243, 196, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --accent-red: #ef4444; 
        }

        html.dark {
            --bg-color: #0a0a0c;
            --surface-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --primary-color: #f9f3c4;
            --primary-light: rgba(249, 243, 196, 0.1);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(59, 130, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            background-attachment: fixed; /* 重要：防止背景随虚拟高度滚动 */
            color: var(--text-primary);
            line-height: 1.6;
            transition: background-color var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ================= 开屏加载动画 ================= */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        
        #splash-screen.slide-up {
            transform: translateY(-100%);
        }

        .splash-spinner {
            width: 50px;
            height: 50px;
            background-color: #0a0a0c;
            animation: sk-rotateplane 1.2s infinite ease-in-out;
            margin-bottom: 2rem;
        }

        .splash-text {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 6px;
            color: #0a0a0c;
            padding-left: 6px;
        }

        @keyframes sk-rotateplane {
            0% { transform: perspective(120px) rotateX(0deg) rotateY(0deg); }
            50% { transform: perspective(120px) rotateX(-180.1deg) rotateY(0deg); }
            100% { transform: perspective(120px) rotateX(-180deg) rotateY(-179.9deg); }
        }

        /* ================= 滑动阻尼核心样式 ================= */
        .viewbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }

        .scrollbox {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }

        .page-boundary {
            width: 100%;
            max-width: 1250px; margin: 6rem auto 3rem auto;
            padding: 20px; border-radius: 25px; background-color: rgba(10, 10, 12, 0.5);
            display: flex; flex-direction: column; gap: 2.5rem;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
            .scrollbox { transition: none !important; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in { animation: fadeIn 0.5s ease-out forwards; }

        nav {
            position: fixed; top: 0; left: 0; right: 0; background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color); z-index: 1000; transition: background-color var(--transition);
        }

        .nav-container { max-width: 1250px; margin: 0 auto; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; margin-right: 1.5rem; font-weight: 500; transition: color var(--transition); }
        .nav-links a:hover { color: var(--primary-color); }
        .nav-actions button { background: none; border: none; color: var(--text-secondary); cursor: pointer; padding: 0.5rem; border-radius: 8px; transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; }
        .nav-actions button:hover { background-color: var(--primary-light); color: var(--primary-color); }

        main { display: none; }

        .card { background-color: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 20px; padding: 2.5rem; margin-bottom: 2.5rem; transition: transform var(--transition), background-color var(--transition); }
        .card:hover { background-color: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }

        /* 去除头部容器和PPT展示容器的卡片背景框 */
        #hero-container, #works-exhibition {
            background-color: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
        }
        #hero-container:hover, #works-exhibition:hover {
            background-color: transparent !important;
            transform: none !important;
        }

        .hero { display: flex; gap: 3.75rem; align-items: center; padding: 0; min-height: 300px; }
        .avatar { flex-shrink: 0; width: 160px; height: 160px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-color), #60a5fa); display: flex; align-items: center; justify-content: center; color: white; font-size: 3.5rem; font-weight: bold; }
        .hero-content h1 { font-size: 3rem; margin-bottom: 0.75rem; color: var(--text-primary); }
        .hero-content h2 { font-size: 1.5rem; color: #28B894; font-weight: 500; margin-bottom: 1.25rem; }
        .hero-content p { font-size: 1.35rem; margin-bottom: 1.5rem; }
        .contact-bar { display: flex; flex-wrap: wrap; gap: 1.25rem; margin-top: 1.5rem; }
        
        .btn { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.25rem; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: var(--transition); text-decoration: none; }
        .btn-filled { background-color: #28B894; color: #0a0a0c; border: 1px solid #28B894; }
        .btn-filled:hover { background-color: #219d7d; border-color: #219d7d; color: #0a0a0c; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(40, 184, 148, 0.3); }
        .btn-outline { background-color: transparent; color: #28B894; border: 1px solid #28B894; }
        .btn-outline:hover { background-color: rgba(40, 184, 148, 0.1); color: #28B894; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(40, 184, 148, 0.2); }

        /* ================= 主页高亮列表 ================= */
        .highlights-list { display: flex; flex-direction: column; width: 100%; gap: 0.9rem; margin-bottom: 1rem; }
        
        .highlights-list:hover .highlight-row { opacity: 0.3; }

        .highlight-row { display: flex; align-items: center; padding: 3rem 2.5rem; border: 1px solid var(--border-color); border-radius: 22px; background-color: rgba(255, 255, 255, 0.04); transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); cursor: pointer; position: relative; overflow: hidden; z-index: 1; margin-top: 0; opacity: 1; }
        
        .highlight-row::before { content: ''; position: absolute; top: 0; left: -155%; width: 145%; height: 100%; background-color: #ffffff; z-index: -1; transform: skewX(-15deg); transition: left 0.6s cubic-bezier(0.19, 1, 0.22, 1); }
        
        .highlights-list .highlight-row:hover { opacity: 1; padding-left: 3rem; }
        .highlight-row:hover::before { left: -6%; }
        
        .highlight-row:hover .hl-num { color: #22c55e; -webkit-text-stroke: 0px transparent; transform: scale(1.05); }
        .highlight-row:hover .hl-title-en { color: #000000; }
        .highlight-row:hover .hl-date-top { color: #000000; }
        .highlight-row:hover .hl-title-cn { color: #475569; }

        .hl-num { font-size: 5.5rem; font-weight: 900; color: transparent; -webkit-text-stroke: 2px var(--text-primary); margin-right: 3.5rem; font-family: 'Impact', 'Arial Black', sans-serif; line-height: 1; min-width: 120px; transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); }
        .hl-content-wrapper { display: flex; flex: 1; justify-content: space-between; align-items: center; position: relative; }
        
        .hl-info { display: flex; align-items: center; gap: 2.5rem; }
        .hl-title-block { display: flex; flex-direction: column; gap: 0.8rem; }
        .hl-title-en { font-size: 3.2rem; font-weight: 900; color: var(--text-primary); font-family: 'Impact', 'Arial Black', sans-serif; letter-spacing: 2px; line-height: 1; transition: color 0.4s ease; }
        .hl-title-cn { font-size: 1rem; color: var(--text-secondary); letter-spacing: 4px; transition: color 0.4s ease; }
        .hl-dates { display: flex; flex-direction: column; text-align: right; gap: 0.5rem; }
        .hl-date-top { font-size: 1.2rem; color: var(--text-secondary); letter-spacing: 1px; transition: color 0.4s ease; }

        /* ================= 全新静态：偏白宽幅卡片排版 ================= */
        .skill-section-title {
            font-size: 4rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 2px #28B894;
            font-family: 'Impact', 'Arial Black', sans-serif;
            letter-spacing: 2px;
            margin: 2rem 0 2rem 2rem; 
        }

        .skills-container {
            display: flex;
            gap: 30px;
            width: 100%;
            margin-bottom: 3rem;
        }

        .skill-card-new {
            flex: 1; /* 让三个卡片均分可用宽度 */
            min-width: 0; /* 防止 flex 子项溢出 */
            height: 480px; 
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            background-color: #f8fafc; /* 偏白色的背景 */
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* 保留悬浮弹起的动态效果 */
        .skill-card-new:hover {
            transform: translateY(-12px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }

        .skill-card-img {
            width: 100%;
            height: 240px; 
            object-fit: cover;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .skill-card-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .sc-header {
            font-size: 0.95rem;
            color: #64748b; 
            font-weight: 600;
            letter-spacing: 1px;
        }

        .sc-title {
            font-size: 2.4rem;
            font-weight: 900;
            font-family: 'Microsoft YaHei', sans-serif;
            color: #0f172a; 
            margin: 0.5rem 0;
            text-align: left;
        }

        .sc-footer {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #28B894; 
            font-weight: bold;
        }

        .section-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }
        footer { width: 100%; text-align: center; padding: 2rem; color: var(--text-secondary); font-size: 0.875rem; border-top: 1px solid var(--border-color); margin-top: 2rem; }
        
        #backToTop { position: fixed; bottom: 2rem; right: 2rem; background-color: var(--primary-color); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; box-shadow: var(--shadow-md); opacity: 0; visibility: hidden; transition: var(--transition); z-index: 1000; }
        #backToTop.show { opacity: 1; visibility: visible; }

        /* 头像特写 */
        .avatar-ring-container { position: relative; width: 300px; height: 300px; border-radius: 50%; padding: 3px; display: flex; justify-content: center; align-items: center; overflow: hidden; background: rgba(255, 255, 255, 0.05); }
        .avatar-ring-container::before { content: ''; position: absolute; width: 100%; height: 100%; background: #0a0a0c; border-radius: 50%; z-index: 1; }
        .avatar-img { position: relative; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; z-index: 2; border: 2px solid #0a0a0c; background: #0a0a0c; transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out; cursor: pointer; will-change: transform; }
        .avatar-img:hover { transform: scale(1.1); box-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }

        /* 渐变文本与打字机光标 */
        .gradient-text { font-weight: 700; font-size: 2rem; line-height: 1.4; background: linear-gradient(90deg, #A855F7, #EC4899, #F97316); background-size: 200% 100%; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 3s ease infinite; }
        #cursor { display: inline-block !important; width: 3.5px !important; height: 1.6em !important; background-color: #EC4899; margin-left: 4px; transform: translateY(-2px); border-radius: 2px; box-shadow: 0 0 8px rgba(236, 72, 153, 0.6); animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* 作品展示板块样式（轮播图带外框，固定中心展示，渐显渐出特效） */
        .works-carousel { position: relative; padding: 2rem 0; overflow: hidden; }
        .carousel-container { position: relative; height: 600px; margin-bottom: 2.5rem; display: flex; justify-content: center; align-items: center; }
        
        .carousel-item { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%); /* 永远居中 */
            width: 90%; 
            max-width: 950px; 
            opacity: 0;
            visibility: hidden;
            /* 渐隐渐出效果 */
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        .frame-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .frame-overlay {
            width: 100%;
            height: auto;
            position: relative;
            z-index: 2;
            pointer-events: none;
        }
        
        .ppt-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 96%;  
            height: 94%; 
            z-index: 1;
            object-fit: cover;
            border-radius: 4px;
        }

        .carousel-item.active { 
            opacity: 1; 
            visibility: visible;
            z-index: 3; 
        }

        .carousel-controls { display: flex; justify-content: center; gap: 1rem; position: relative; z-index: 5; }
        .carousel-btn { background-color: var(--surface-color); border: 1px solid var(--border-color); color: var(--primary-color); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; transition: var(--transition); font-size: 1rem; font-weight: 500; }
        .carousel-btn:hover { background-color: var(--primary-light); border-color: var(--primary-color); color: var(--primary-color); }

        /* ================= 悬浮框及内置组合图 ================= */
        #floating-preview {
            position: fixed; 
            max-width: 500px; 
            border-radius: 12px; 
            pointer-events: none; 
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.9) rotate(0deg); 
            transition: opacity 0.3s ease, transform 0.3s ease; 
            z-index: 99999; 
            box-shadow: 0 25px 50px -10px rgba(0,0,0,0.8);
            border: 2px solid rgba(255, 255, 255, 0.1); 
            padding: 6px; 
            background: rgba(10, 10, 12, 0.95);
            display: block; 
        }
        #floating-preview.visible { opacity: 1; }
        
        #floating-preview > img { 
            display: block;
            width: auto; 
            height: auto; 
            max-width: 100%; 
            max-height: 268px; 
            object-fit: contain; 
            border-radius: 6px; 
        }

        .mockup-frame {
            display: flex;
            gap: 6px; 
            background: #1c1c1e; 
            padding: 8px; 
            border-radius: 10px; 
            height: 268px; 
            box-sizing: border-box;
            border: 1px solid rgba(255,255,255,0.08); 
        }
        
        .mockup-frame img {
            flex: 1;
            width: 150px; 
            height: 100%;
            object-fit: cover; 
            object-position: top; 
            border-radius: 4px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* ================= 基础模态框 ================= */
        #material-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(10, 10, 12, 0.98); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 10000; display: flex; flex-direction: column; opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s ease; overflow-y: auto; overflow-x: hidden; 
        }
        #material-modal.show { opacity: 1; visibility: visible; }
        #material-modal::before { content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, transparent 30%, #0a0a0c 95%); z-index: 1; pointer-events: none; opacity: 0; transition: opacity 0.5s ease; }
        #material-modal.show::before { opacity: 1; }

        .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 5%; border-bottom: 1px solid rgba(255, 255, 255, 0.1); position: sticky; top: 0; background: rgba(10, 10, 12, 0.9); backdrop-filter: blur(10px); z-index: 10; }
        .modal-title { font-size: 2rem; font-weight: 900; font-family: 'Microsoft YaHei', system-ui, sans-serif; color: var(--text-primary); display: flex; align-items: center; gap: 1rem; }
        .modal-title span { font-size: 1.2rem; color: var(--text-secondary); font-weight: normal; }
        .modal-close { background: none; border: none; color: var(--text-primary); font-size: 3rem; cursor: pointer; transition: color 0.3s ease, transform 0.3s ease; line-height: 1; z-index: 11; }
        .modal-close:hover { color: var(--accent-red); transform: rotate(90deg); }
        .modal-body { position: relative; z-index: 2; padding: 3rem 5%; display: flex; flex-direction: column; align-items: center; gap: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .modal-body img { max-width: 100%; height: auto; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255, 255, 255, 0.05); }

        /* 放映机模式特效 */
        .modal-hero-header { text-align: center; margin-bottom: 2rem; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1rem; position: relative; animation: fadeIn 0.6s ease-out forwards; }
        .projector-image-container { position: absolute; left: calc(50% - 720px); top: calc(50% - 25px); transform: translateY(-50%); z-index: 3; animation: projectorRumble 0.1s infinite; }
        .projector-image-container img { width: 250px; height: auto; box-shadow: none !important; border: none !important; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); }
        .modal-hero-title-wrapper { display: flex; align-items: center; justify-content: center; gap: 1.5rem; flex-wrap: wrap; position: relative; z-index: 2; }
        .modal-hero-title { font-size: 5.5rem; font-weight: 900; color: var(--text-primary); font-family: 'Impact', 'Microsoft YaHei', sans-serif; text-transform: uppercase; letter-spacing: 2px; line-height: 1.1; }
        .modal-hero-num { font-size: 6.5rem; font-weight: 900; color: transparent; -webkit-text-stroke: 2.5px #22c55e; font-family: 'Impact', 'Arial Black', sans-serif; line-height: 1; transform: translateY(-5px); }
        .modal-hero-subtitle { font-size: 1.5rem; color: var(--text-secondary); letter-spacing: 6px; font-family: 'Microsoft YaHei', system-ui, sans-serif; }
        
        .wps-resume-title {
            font-size: 1.8rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 1.5px #22c55e; 
            font-family: 'Microsoft YaHei', sans-serif;
            letter-spacing: 2px;
            margin-top: 4rem; 
            margin-bottom: 2rem; 
            text-align: center;
            width: 100%;
        }

        .projector-beam { position: absolute; top: calc(50% - 25px); left: calc(50% - 490px); width: 150vw; height: 400px; transform: translateY(-50%); background: linear-gradient(90deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0.1) 40%, transparent 100%); clip-path: polygon(0 47%, 100% -30%, 100% 130%, 0 53%); pointer-events: none; z-index: 0; mix-blend-mode: screen; animation: beamPulse 0.1s infinite; transform-origin: left center; }
        .projector-text-effect { background-image: repeating-linear-gradient(to bottom, var(--text-primary) 0px, var(--text-primary) 4px, rgba(0, 0, 0, 0.6) 4px, rgba(0, 0, 0, 0.6) 8px); background-size: 100% 8px; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: scanlinesAnim 1s linear infinite, textGlitch 0.2s infinite; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4)); }

        @keyframes projectorRumble { 0% { transform: translateY(-50%) translate(0, 0); } 25% { transform: translateY(-50%) translate(1px, 1px); } 50% { transform: translateY(-50%) translate(-1px, 0px); } 75% { transform: translateY(-50%) translate(0px, -1px); } 100% { transform: translateY(-50%) translate(0, 0); } }
        @keyframes beamPulse { 0%, 100% { opacity: 0.6; filter: brightness(1); } 30% { opacity: 0.4; filter: brightness(0.8); } 50% { opacity: 0.7; filter: brightness(1.2); } 70% { opacity: 0.5; filter: brightness(0.9); } }
        @keyframes scanlinesAnim { from { background-position: 0 0; } to { background-position: 0 8px; } }
        @keyframes textGlitch { 0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4)); } 50% { filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.6)) drop-shadow(1px 0 0 rgba(255,0,0,0.2)) drop-shadow(-1px 0 0 rgba(0,255,255,0.2)); } }

        /* ================= 第3/4项：PPT 无限画廊特效 ================= */
        #material-modal.ppt-mode .modal-body { max-width: 100%; padding: 0; margin: 0; height: 100vh; display: block; overflow: hidden; }
        #material-modal.ppt-mode .modal-header { display: none !important; }

        .ppt-back-btn {
            position: fixed; top: 30px; left: 30px; background: rgba(0,0,0,0.5); color: #fff;
            border: 1px solid rgba(255,255,255,0.3); padding: 10px 20px; border-radius: 30px;
            cursor: pointer; z-index: 10001; font-size: 1rem; transition: all 0.3s; backdrop-filter: blur(10px);
        }
        .ppt-back-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        .ppt-intro { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-color); z-index: 100; transition: opacity 0.5s ease; }
        .ppt-intro-title-wrapper { display: flex; align-items: center; justify-content: center; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .ppt-intro-title { font-size: 5.5rem; font-weight: 900; font-family: 'Impact', 'Microsoft YaHei', sans-serif; text-transform: uppercase; letter-spacing: 2px; line-height: 1.1; background: linear-gradient(90deg, #A855F7, #EC4899, #F97316); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: gradientShift 3s ease infinite; }
        .ppt-intro-num { font-size: 6.5rem; font-weight: 900; color: transparent; -webkit-text-stroke: 2.5px #22c55e; font-family: 'Impact', 'Arial Black', sans-serif; line-height: 1; transform: translateY(-5px); }
        .ppt-intro-subtitle { font-size: 1.5rem; color: var(--text-secondary); letter-spacing: 6px; font-family: 'Microsoft YaHei', system-ui, sans-serif; margin-bottom: 3rem; }
        .ppt-intro-desc { font-size: 0.9rem; color: #888; margin-bottom: 2rem; }
        .ppt-intro-arrow { width: 60px; height: 60px; border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; animation: bounceArrow 2s infinite; transition: background 0.3s; }
        .ppt-intro-arrow:hover { background: rgba(255,255,255,0.1); }
        @keyframes bounceArrow { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }

        #viewport {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; display: flex; align-items: center; justify-content: center; 
            cursor: none; 
            z-index: 10;
            user-select: none;
            -webkit-user-select: none;
        }
        
        #viewport * {
            user-select: none !important;
            -webkit-user-select: none !important;
            -webkit-user-drag: none !important;
        }
        
        body.is-dragging #viewport { cursor: none; }

        #custom-drag-cursor {
            position: fixed;
            width: 64px;
            height: 64px;
            background-color: #22c55e;
            border-radius: 50%;
            pointer-events: none; 
            z-index: 100000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translate(-50%, -50%) scale(0.5);
            transition: opacity 0.3s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s ease;
            left: 50%;
            top: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        #viewport:hover #custom-drag-cursor {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        body.is-dragging #custom-drag-cursor {
            background-color: #16a34a;
            transform: translate(-50%, -50%) scale(0.85);
            box-shadow: 0 5px 10px rgba(0,0,0,0.4);
        }

        #rain-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;
        }
        .ppt-intro-content-wrapper {
            position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 100%;
        }

        #canvas-container {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 20px; 
            width: max-content; height: max-content; will-change: transform;
            position: absolute; left: 50%; top: 50%;
        }
        .tile { display: grid; grid-template-columns: repeat(5, 380px); grid-template-rows: repeat(4, 240px); gap: 20px; }
        .ppt-img-wrapper { width: 100%; height: 100%; }
        .ppt-img-wrapper img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); pointer-events: none; border: 1px solid rgba(255,255,255,0.05); }

        .drag-banner {
            position: fixed; background: #ccff00; color: #000; font-family: 'Impact', sans-serif;
            font-size: 32px; font-weight: bold; letter-spacing: 4px; z-index: 10005; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease; 
            display: flex; align-items: center; overflow: hidden;
        }
        body.is-dragging .drag-banner { opacity: 1; }
        
        .banner-top { top: 0; left: 0; right: 0; height: 50px; }
        .banner-bottom { bottom: 0; left: 0; right: 0; height: 50px; }
        .banner-left { top: 0; bottom: 0; left: 0; width: 50px; justify-content: center; writing-mode: vertical-lr; transform: rotate(180deg); }
        .banner-right { top: 0; bottom: 0; right: 0; width: 50px; justify-content: center; writing-mode: vertical-lr; }

        .marquee { white-space: nowrap; animation-play-state: paused; }
        body.is-dragging .marquee.track-x { animation: scroll-x 10s linear infinite running; }
        body.is-dragging .marquee.track-y { animation: scroll-y 10s linear infinite running; }
        
        @keyframes scroll-x { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        @keyframes scroll-y { 0% { transform: translateY(0); } 100% { transform: translateY(-50%); } }

        @media (max-width: 1400px) {
            .projector-image-container { left: calc(50% - 580px); }
            .projector-image-container img { width: 200px; }

        @media (max-width: 900px) {

        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; gap: 1.5rem; }
            .contact-bar { justify-content: center; }
            .nav-links { display: none; }
            .hl-content-wrapper { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
            .hl-dates { text-align: left; }
            .hl-num { font-size: 3rem; margin-right: 1.5rem; }
            .hl-title-en { font-size: 1.8rem; }
            .modal-hero-title { font-size: 3rem; }
            .modal-hero-num { font-size: 3.5rem; -webkit-text-stroke: 1.5px #22c55e; }
            .modal-hero-subtitle { font-size: 1rem; letter-spacing: 3px; }
            .ppt-intro-title { font-size: 3rem; }
            .ppt-intro-num { font-size: 3.5rem; -webkit-text-stroke: 1.5px #22c55e; }
            .ppt-intro-subtitle { font-size: 1rem; letter-spacing: 3px; }
            .projector-image-container { left: -60px; opacity: 0.3; top: calc(50% - 15px); } 
            .projector-image-container img { width: 140px; }
            .projector-beam { left: 60px; height: 250px; top: calc(50% - 15px); clip-path: polygon(0 46%, 100% -10%, 100% 110%, 0 54%); }
            
            .skill-section-title { font-size: 3rem; margin: 0 0 1rem 1rem; }
        }

        @media print {
            body { background-color: white; color: black; }
            html.dark { --bg-color: white; --surface-color: white; --text-primary: black; --text-secondary: #333; }
            nav, .nav-actions, .btn-print, #backToTop, .viewbox { display: none !important; }
            main { margin-top: 0; padding: 0; max-width: 100%; }
            .card { box-shadow: none; border: none; padding: 1rem 0; margin-bottom: 1rem; border-bottom: 1px solid #ccc; border-radius: 0; }
            .hero { align-items: flex-start; }
            .avatar { width: 100px; height: 100px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .hl { background: none; color: black; font-weight: bold; }
            .hl-num { -webkit-text-stroke: 1.5px black; }
            .hl-title-en { color: black; }
            @page { margin: 1.5cm; }
            .skills-container, .skill-section-title { display: none !important; }
        }
    </style>
</head>

    <nav>
        <div class="nav-container">
            <div style="font-weight: bold; font-size: 1.25rem; color: var(--primary-color);">李强</div>
            <div class="nav-links"></div>
            <div class="nav-actions">
                <button id="themeToggle" title="切换深浅色" aria-label="切换深浅色"><svg width="20" height="20"><use id="themeIcon" href="#icon-moon"></use></svg></button>

    <!-- ★ 加入了滑动阻尼的包裹层结构 ★ -->
    <div class="viewbox">

            <div class="page-boundary">
                <section id="hero-container" class="card fade-in" style="animation-delay: 1.1s;"></section>

    <script type="module">
        import { createClient } from '@supabase/supabase-js'

        const supabase = createClient(
            import.meta.env.VITE_SUPABASE_URL,
            import.meta.env.VITE_SUPABASE_ANON_KEY
        )
        window.supabase = supabase

        // ===== 从 Supabase 拉取数据 =====
        async function fetchResumeData() {
            const [{ data: personalRows }, { data: highlightRows }, { data: skillRows }, { data: pptRows }] = await Promise.all([
                supabase.from('personal_info').select('*').limit(1),
                supabase.from('highlights').select('*').order('id'),
                supabase.from('skills').select('*').order('id'),
                supabase.from('ppt_works').select('*').order('id')
            ])

            const p = personalRows[0]
            return {
                personal: {
                    name: p.name,
                    title: p.title,
                    contact: {
                        phone: p.phone,
                        wechat: p.wechat,
                        // email 存的是 "xxx@163.com"，拆成数组供渲染函数使用
                        email: p.email.split('@')
                    }
                },
                highlights: highlightRows.map(r => ({
                    num: r.num,
                    titleEn: r.title_en,
                    titleCn: r.title_cn,
                    dateTop: r.date_top,
                    preview: r.preview || []
                })),
                accordions: skillRows.map(r => ({
                    num: r.num,
                    titleEn: r.title_en,
                    titleCn: r.title_cn,
                    preview: r.preview || []
                })),
                pptWorks: (pptRows || []).map(r => ({
                    imageUrl: r.image_url,
                    altText: r.alt_text
                }))
            }
        }

        function highlightText(text) {
            const regex = /(\d+%|\d+\+|1w\+|3.75|LovartAI|Coze|AI智能体|0失误)/g;
            return text.replace(regex, '<span class="hl">$1</span>');
        }

        // resumeData 全局变量，由 fetchResumeData 赋值后供 openMaterial 使用
        let resumeData = {}

        // copyWechat 必须挂到 window，因为 onclick="" 在 HTML 中是全局作用域调用
        window.copyWechat = function copyWechat(wechatId) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(wechatId).then(() => {
                    alert('✅ 微信号已复制：' + wechatId + '\n请打开微信，搜索该ID即可添加好友。');
                }).catch(() => {
                    // 降级方案：execCommand
                    _fallbackCopy(wechatId);
                });
            } else {
                _fallbackCopy(wechatId);
            }
        }

        function _fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0;';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                document.execCommand('copy');
                alert('✅ 微信号已复制：' + text + '\n请打开微信，搜索该ID即可添加好友。');
            } catch (err) {
                alert('复制失败，请手动复制微信号：' + text);
            }
            document.body.removeChild(textarea);
        }

        function renderHero() {
            const container = document.getElementById('hero-container');
            const { name, title, contact } = resumeData.personal;
            const mailTo = `mailto:${contact.email[0]}@${contact.email[1]}`;

            container.innerHTML = `
                <div class="hero">
                    <div class="avatar-ring-container">
                        <img src="/images/wechat-avatar.jpg" alt="${name}" class="avatar-img">
                    </div>
                    <div class="hero-content">
                        <h1 style="font-family: '演示流云楷', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;">${name}</h1>
                        <h2>${title}</h2>
                        <p style="max-width: 100%; font-family: '云峰飞云体', 'Microsoft YaHei', system-ui, -apple-system, sans-serif; white-space: nowrap; display: inline-flex !important; align-items: center !important; margin-bottom: 12px; line-height: 1.2;">
                            <span id="intro-text" class="gradient-text"></span><span id="cursor"></span>
                        </p>
                        <div class="contact-bar">
                            <a href="tel:${contact.phone}" class="btn btn-filled">
                                <svg width="16" height="16"><use href="#icon-phone"></use></svg> ${contact.phone}
                            </a>
                            <button class="btn btn-outline" onclick="copyWechat('${contact.wechat}')">
                                <svg width="16" height="16"><use href="#icon-wechat"></use></svg> ${contact.wechat} (点击复制)
                            </button>
                            <a href="${mailTo}" class="btn btn-outline">
                                <svg width="16" height="16"><use href="#icon-mail"></use></svg> 发送邮件
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderHighlights() {
            const container = document.getElementById('highlights-container');
            const html = resumeData.highlights.map((item, index) => `
                <div class="highlight-row" data-preview='${JSON.stringify(item.preview)}' ondblclick="openMaterial(${index}, 'highlight')">
                    <div class="hl-num">${item.num}</div>
                    <div class="hl-content-wrapper">
                        <div class="hl-info">
                            <div class="hl-title-block">
                                <div class="hl-title-en">${item.titleEn}</div>
                                <div class="hl-title-cn">${item.titleCn}</div>
                            </div>
                        </div>
                        <div class="hl-dates">
                            <div class="hl-date-top">${item.dateTop}</div>
                        </div>
                    </div>
                </div>
            `).join('');
            container.innerHTML = `<div class="highlights-list">${html}</div>`;
            initHoverPreview();
        }
        
        function renderAccordion() {
            const container = document.getElementById('accordion-container-wrapper');
            container.innerHTML = `
                <div class="skill-section-title">Skill</div>
                <div class="skills-container">
                    <div class="skill-card-new" onclick="openMaterial(0, 'accordion')">
                        <img src="/images/ai-apps.png" alt="AI应用" class="skill-card-img">
                        <div class="skill-card-content">
                            <div class="sc-header">01 / 工具赋能</div>
                            <h2 class="sc-title">AI应用</h2>
                            <div class="sc-footer">探索工作流 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
                        </div>
                    </div>
                    
                    <div class="skill-card-new" onclick="openMaterial(1, 'accordion')">
                        <!-- 修正为 .webp -->
                        <img src="/images/video-edit.webp" alt="剪辑" class="skill-card-img">
                        <div class="skill-card-content">
                            <div class="sc-header">02 / 视觉呈现</div>
                            <h2 class="sc-title">剪辑</h2>
                            <div class="sc-footer">查看视频作品 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
                        </div>
                    </div>
                    
                    <div class="skill-card-new" onclick="openMaterial(2, 'accordion')">
                        <img src="/images/office.png" alt="办公软件" class="skill-card-img">
                        <div class="skill-card-content">
                            <div class="sc-header">03 / 效率提升</div>
                            <h2 class="sc-title">办公软件</h2>
                            <div class="sc-footer">了解更多 <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function generateSingleTileHTML(images) {
            const ROWS = 4;
            const COLS = 5;
            const grid = Array(ROWS).fill().map(() => Array(COLS).fill(''));
            let html = '';

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const invalid = new Set();
                    if (r > 0) invalid.add(grid[r-1][c]); 
                    if (c > 0) invalid.add(grid[r][c-1]); 
                    if (r === ROWS - 1) invalid.add(grid[0][c]); 
                    if (c === COLS - 1) invalid.add(grid[r][0]);

                    let validImages = images.filter(img => !invalid.has(img));
                    if (validImages.length === 0) validImages = images; 

                    validImages.sort(() => Math.random() - 0.5);
                    grid[r][c] = validImages[0];

                    html += `<div class="ppt-img-wrapper"><img src="${grid[r][c]}" class="ppt-img-card" draggable="false" /></div>`;
                }
            }
            return html;
        }

        window.enterPptCanvas = function enterPptCanvas() {
            const intro = document.getElementById('ppt-intro');
            const viewport = document.getElementById('viewport');
            
            if (rainAnimationId) cancelAnimationFrame(rainAnimationId); 
            
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                viewport.style.opacity = '1';
                viewport.style.pointerEvents = 'auto';
            }, 500);
        }

        let globalDragHandlers = {};
        let rainAnimationId = null;

        function initRainEffect() {
            const canvas = document.getElementById('rain-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;
            
            window.addEventListener('resize', () => {
                if(canvas) {
                    width = canvas.width = window.innerWidth;
                    height = canvas.height = window.innerHeight;
                }
            });

            const colors = ['#EC4899', '#00f0ff', '#F97316', '#22c55e', '#A855F7'];
            const drops = [];
            const dropCount = 40; 

            for (let i = 0; i < dropCount; i++) {
                drops.push({
                    x: Math.random() * width,
                    y: Math.random() * height - height,
                    l: Math.random() * 35 + 15,
                    w: Math.random() * 4 + 3,
                    s: Math.random() * 2 + 1.5,
                    c: colors[Math.floor(Math.random() * colors.length)],
                    o: Math.random() * 0.5 + 0.2,
                    blur: Math.random() * 12 + 4
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                
                drops.forEach(drop => {
                    ctx.beginPath();
                    ctx.moveTo(drop.x, drop.y);
                    ctx.lineTo(drop.x, drop.y + drop.l);
                    ctx.strokeStyle = drop.c;
                    ctx.lineWidth = drop.w;
                    ctx.lineCap = 'round'; 
                    ctx.globalAlpha = drop.o;
                    
                    ctx.shadowBlur = drop.blur;
                    ctx.shadowColor = drop.c;
                    
                    ctx.stroke();
                    
                    ctx.shadowBlur = 0;
                    
                    drop.y += drop.s;
                    
                    if (drop.y > height) {
                        drop.y = -drop.l;
                        drop.x = Math.random() * width;
                    }
                });
                
                rainAnimationId = requestAnimationFrame(draw);
            }
            
            draw();
        }

        function initSeamlessInfiniteCanvas() {
            const viewport = document.getElementById('viewport');
            const canvasContainer = document.getElementById('canvas-container');
            if (!viewport || !canvasContainer) return;

            const TILE_W = 2000;
            const TILE_H = 1040;

            let isDown = false;
            let panX = 0, panY = 0;
            let startMouseX = 0, startMouseY = 0;

            function mod(n, m) {
                return ((n % m) + m) % m;
            }

            function updateTransform() {
                let offsetX = mod(panX, TILE_W) - TILE_W * 1.5;
                let offsetY = mod(panY, TILE_H) - TILE_H * 1.5;
                canvasContainer.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            }

            updateTransform();

            viewport.addEventListener('mousedown', (e) => {
                e.preventDefault(); 
                isDown = true;
                document.body.classList.add('is-dragging'); 
                startMouseX = e.clientX;
                startMouseY = e.clientY;
            });

            globalDragHandlers.onMouseUp = () => {
                isDown = false;
                document.body.classList.remove('is-dragging');
            };
            
            globalDragHandlers.onMouseMove = (e) => {
                const customCursor = document.getElementById('custom-drag-cursor');
                if (customCursor) {
                    customCursor.style.left = e.clientX + 'px';
                    customCursor.style.top = e.clientY + 'px';
                }

                if (!isDown) return;
                e.preventDefault();
                const dx = (e.clientX - startMouseX) * 1.5;
                const dy = (e.clientY - startMouseY) * 1.5;
                panX += dx;
                panY += dy;
                startMouseX = e.clientX;
                startMouseY = e.clientY;
                updateTransform();
            };

            window.addEventListener('mouseup', globalDragHandlers.onMouseUp);
            document.addEventListener('mousemove', globalDragHandlers.onMouseMove);
            viewport.addEventListener('mouseleave', globalDragHandlers.onMouseUp);
        }

        window.openMaterial = function openMaterial(index, type = 'highlight') {
            const data = type === 'accordion' ? resumeData.accordions[index] : resumeData.highlights[index];
            const modal = document.getElementById('material-modal');
            const defaultHeader = document.getElementById('default-modal-header');
            const imagesEl = document.getElementById('modal-images');

            imagesEl.innerHTML = '';

            if (type === 'highlight' && (index === 2 || index === 3)) {
                modal.classList.add('ppt-mode');
                
                const tileHtml = `<div class="tile">${generateSingleTileHTML(data.preview)}</div>`;
                
                const dragText = "DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ DRAG ➔ ";
                const doubleDragText = dragText + dragText;

                let pptHtml = `
                    <button class="ppt-back-btn" onclick="closeMaterial()">❮ 返回首页</button>
                    
                    <div class="ppt-intro" id="ppt-intro">
                        <canvas id="rain-canvas"></canvas>
                        <div class="ppt-intro-content-wrapper">
                            <div class="ppt-intro-title-wrapper">
                                <h1 class="ppt-intro-title">${data.titleEn}</h1>
                                <div class="ppt-intro-num">${data.num}</div>
                            </div>
                            <h2 class="ppt-intro-subtitle">${data.titleCn}</h2>
                            <p class="ppt-intro-desc">- 任意方向拖拽或滑动，探索图片宇宙 -</p>
                            <div class="ppt-intro-arrow" onclick="enterPptCanvas()">
                                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
                            </div>
                        </div>
                    </div>

                    <div class="drag-banner banner-top"><div class="marquee track-x">${doubleDragText}</div></div>
                    <div class="drag-banner banner-bottom"><div class="marquee track-x" style="animation-direction: reverse;">${doubleDragText}</div></div>
                    <div class="drag-banner banner-left"><div class="rotated-container left-rot"><div class="marquee track-y">${doubleDragText}</div></div></div>
                    <div class="drag-banner banner-right"><div class="rotated-container right-rot"><div class="marquee track-y" style="animation-direction: reverse;">${doubleDragText}</div></div></div>

                    <div id="viewport" style="opacity: 0; pointer-events: none;">
                        <div id="canvas-container">
                            ${tileHtml}${tileHtml}${tileHtml}
                            ${tileHtml}${tileHtml}${tileHtml}
                            ${tileHtml}${tileHtml}${tileHtml}
                        </div>
                        <div id="custom-drag-cursor">
                            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 19V5M5 12l7-7 7 7"/>
                            </svg>
                        </div>
                    </div>
                `;
                imagesEl.innerHTML = pptHtml;
                
                initSeamlessInfiniteCanvas();
                initRainEffect(); 

            } else {
                modal.classList.remove('ppt-mode');
                defaultHeader.style.display = 'flex';
                document.getElementById('modal-title').innerHTML = ``; 

                const isProjectorMode = (type === 'highlight' && index === 0); 
                const heroHeader = document.createElement('div');
                heroHeader.className = 'modal-hero-header';
                
                const beamHtml = isProjectorMode ? `
                    <div class="projector-image-container"><img src="/images/projector.png" alt="Projector"></div>
                    <div class="projector-beam"></div>
                ` : '';
                const titleClass = isProjectorMode ? 'modal-hero-title projector-text-effect' : 'modal-hero-title';

                heroHeader.innerHTML = `
                    ${beamHtml}
                    <div class="modal-hero-title-wrapper">
                        <div class="${titleClass}">${data.titleEn}</div>
                        <div class="modal-hero-num">${data.num}</div>
                    </div>
                    <div class="modal-hero-subtitle">${data.titleCn}</div>
                `;
                imagesEl.appendChild(heroHeader);

                if (type === 'accordion' && index === 2) {
                    const wpsTitle = document.createElement('div');
                    wpsTitle.className = 'wps-resume-title';
                    wpsTitle.textContent = 'WPS撰写简历';
                    imagesEl.appendChild(wpsTitle);
                }

                if(data.preview && data.preview.length > 0) {
                    data.preview.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        imagesEl.appendChild(img);
                    });
                } else {
                    imagesEl.innerHTML += `<p style="color: var(--text-secondary); margin-top: 3rem; font-size: 1.2rem;">素材准备中...</p>`;
                }
            }

            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        window.closeMaterial = function closeMaterial() {
            const modal = document.getElementById('material-modal');
            modal.classList.remove('show');
            document.body.style.overflow = ''; 
            
            if (rainAnimationId) cancelAnimationFrame(rainAnimationId); 
            
            if (globalDragHandlers.onMouseUp) {
                window.removeEventListener('mouseup', globalDragHandlers.onMouseUp);
                document.removeEventListener('mousemove', globalDragHandlers.onMouseMove);
            }
            document.body.classList.remove('is-dragging');
            
            setTimeout(() => {
                modal.classList.remove('ppt-mode');
                document.getElementById('default-modal-header').style.display = 'flex';
            }, 400);
        }

        function initTheme() {
            const toggleBtn = document.getElementById('themeToggle');
            const icon = document.getElementById('themeIcon');
            const html = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                html.classList.add('dark'); icon.setAttribute('href', '#icon-sun');
            }
            toggleBtn.addEventListener('click', () => {
                html.classList.toggle('dark');
                const isDark = html.classList.contains('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
                icon.setAttribute('href', isDark ? '#icon-sun' : '#icon-moon');
            });
        }

        function initScroll() {
            const backToTopBtn = document.getElementById('backToTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) backToTopBtn.classList.add('show');
                else backToTopBtn.classList.remove('show');
            });
        }

        function initAvatarTilt() {
            const avatar = document.querySelector('.avatar');
            if (!avatar) return;
            avatar.addEventListener('mousemove', (e) => {
                const rect = avatar.getBoundingClientRect();
                const x = e.clientX - rect.left, y = e.clientY - rect.top;
                const centerX = rect.width / 2, centerY = rect.height / 2;
                const rotateX = (y - centerY) / 10, rotateY = (centerX - x) / 10;
                avatar.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            });
            avatar.addEventListener('mouseleave', () => {
                avatar.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
            });
        }

        let currentSlide = 0; // 默认展示第一张
        let totalSlides = 3; // 由 renderPPTWorks 动态更新

        function renderPPTWorks(pptData) {
            const container = document.getElementById('carousel-container');
            if (!container || !pptData || pptData.length === 0) return;

            container.innerHTML = pptData.map((item, index) => `
                <div class="carousel-item${index === 0 ? ' active' : ''}" data-index="${index}">
                    <div class="frame-wrapper">
                        <img src="/images/frame.png" class="frame-overlay" alt="画框">
                        <img src="${item.imageUrl}" class="ppt-content" alt="${item.altText}">
                    </div>
                </div>
            `).join('');

            // 更新总张数，重置当前索引，重新初始化轮播状态
            totalSlides = pptData.length;
            currentSlide = 0;
            initSlidePositions();
        }

        // 执行简单的渐显渐出动画并切换内容
        function updateSlidePositions() {
            const items = document.querySelectorAll('.carousel-item');
            if (items.length === 0) return;

            items.forEach((item, index) => {
                if (index === currentSlide) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }

        // 初始化时直接显示
        function initSlidePositions() {
            updateSlidePositions();
        }

        window.prevSlide = function prevSlide() { 
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides; 
            updateSlidePositions(); 
        }
        window.nextSlide = function nextSlide() { 
            currentSlide = (currentSlide + 1) % totalSlides; 
            updateSlidePositions(); 
        }
        
        function initHoverPreview() {
            const previewEl = document.getElementById('floating-preview');
            const rows = document.querySelectorAll('.highlight-row');

            rows.forEach(row => {
                row.addEventListener('mouseenter', (e) => {
                    const previewData = row.getAttribute('data-preview');
                    const numText = row.querySelector('.hl-num').textContent.trim();

                    if (previewData) {
                        try {
                            const imgSrcs = JSON.parse(previewData);
                            
                            if (imgSrcs && imgSrcs.length > 0) {
                                if (numText === '01' && imgSrcs.length >= 2) {
                                    previewEl.innerHTML = `
                                        <div class="mockup-frame">
                                            <img src="${imgSrcs[0]}" alt="预览左">
                                            <img src="${imgSrcs[1]}" alt="预览右">
                                        </div>
                                    `;
                                } else {
                                    const firstImageSrc = imgSrcs[0];
                                    previewEl.innerHTML = `<img src="${firstImageSrc}" alt="作品预览">`;
                                }
                                
                                previewEl.classList.add('visible');
                                previewEl.style.left = e.clientX + 'px';
                                previewEl.style.top = e.clientY + 'px';
                                previewEl.style.transform = 'translate(-50%, -50%) scale(1) rotate(-5deg)';
                            }
                        } catch(err) {
                            console.error("图片数据解析失败", err);
                        }
                    }
                });

                row.addEventListener('mousemove', (e) => {
                    requestAnimationFrame(() => {
                        previewEl.style.left = e.clientX + 'px';
                        previewEl.style.top = e.clientY + 'px';
                        previewEl.style.transform = 'translate(-50%, -50%) scale(1) rotate(-5deg)';
                    });
                });

                row.addEventListener('mouseleave', () => {
                    previewEl.classList.remove('visible');
                    previewEl.style.transform = 'translate(-50%, -50%) scale(0.9) rotate(0deg)';
                });
            });
        }

        function initScrollReveal() {
            const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) entry.target.classList.add('reveal-active');
                });
            }, observerOptions);
            document.querySelectorAll('.card, .highlight-item, .highlight-row, #highlights-container, .grid-2 > section, #accordion-container-wrapper').forEach(el => {
                el.classList.add('reveal'); observer.observe(el);
            });
        }

        function typeWriter(element, text, speed = 150) {
            let i = 0; element.textContent = ''; 
            function type() {
                if (i < text.length) {
                    element.textContent += text.charAt(i); i++;
                    setTimeout(type, speed + (Math.random() * 60 - 30));
                }
            }
            type();
        }

        // ================= 滑动阻尼特效核心控制 =================
        function initSmoothScrolling() {
            const scrollbox = document.querySelector('.scrollbox');
            
            function syncBodyHeight() {
                if (scrollbox) {
                    const height = scrollbox.offsetHeight;
                    document.body.style.height = `${height}px`;
                }
            }

            function applySmoothScroll() {
                if (scrollbox) {
                    scrollbox.style.transform = `translateY(${-window.scrollY}px)`;
                }
            }

            if (scrollbox) {
                const resizeObserver = new ResizeObserver(() => {
                    syncBodyHeight();
                });
                resizeObserver.observe(scrollbox);
            }

            window.addEventListener('scroll', applySmoothScroll, { passive: true });
            window.addEventListener('resize', syncBodyHeight);
            
            syncBodyHeight();
            applySmoothScroll();
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // 先从 Supabase 拉取数据，赋值给全局 resumeData
            resumeData = await fetchResumeData()

            // 数据就绪后再渲染页面
            renderHero();
            renderHighlights();
            renderAccordion();
            renderPPTWorks(resumeData.pptWorks);
            initTheme(); initScroll(); initAvatarTilt(); initScrollReveal();
            
            // 激活滑动阻尼
            initSmoothScrolling();

            // 控制开屏动画逻辑
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if(splash) {
                    splash.classList.add('slide-up');
                    setTimeout(() => splash.remove(), 800); 
                }
            }, 1200); 
            
            // 顺延打字机效果
            setTimeout(() => {
                const introText = document.getElementById('intro-text');
                if (introText) typeWriter(introText, '大一学生，一名AI编程爱好者', 150);
            }, 1800); 
        });
    </script>
